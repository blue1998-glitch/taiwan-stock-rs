name: Market RS & Theme Ranker

on:
  schedule:
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

jobs:
  update-rankings:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests numpy beautifulsoup4 yfinance

      - name: Run Build Themes & Momentum Engine
        run: |
          python data/build_themes.py
          python rank_all.py

      - name: Commit and Push Database
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/theme_mapping.json market_rankings.json || true
          git commit -m "Auto-update RS rankings & theme taxonomy: $(date +'%Y-%m-%d')" || exit 0
          git push
